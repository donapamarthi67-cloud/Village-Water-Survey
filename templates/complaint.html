{% extends "base.html" %}
{% block content %}
<div class="section"><div class="container" style="max-width:850px">
<h1 class="section-title">Report a Water Problem / నీటి సమస్యను నివేదించండి</h1>
<p class="small-muted">Tell the authority what is happening. You can upload a photo.</p>
<form method="post" enctype="multipart/form-data" class="form-card mt-4">
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Name / పేరు *</label><input name="name" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Mobile / మొబైల్ *</label><input name="mobile" class="form-control" type="tel" required></div>
<div class="col-md-6"><label class="form-label">Ward / వార్డు *</label><input name="ward" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Location / ప్రదేశం *</label><input name="location" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Problem category / సమస్య రకం *</label><select name="category" class="form-select" required>
{% for x in ["No drinking water / తాగునీరు లేదు","Irregular supply / క్రమం తప్పిన సరఫరా","Poor water quality / నీటి నాణ్యత","Broken pipeline / పైప్‌లైన్","Broken tap / కుళాయి","Borewell / బోర్‌వెల్","Hand pump / చేతి పంపు","Water tank / నీటి ట్యాంక్","Tanker / ట్యాంకర్","Drainage / డ్రైనేజీ","Other / ఇతర"] %}<option>{{x}}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">How long? / ఎంతకాలంగా?</label><input name="duration" class="form-control"></div>
<div class="col-12"><label class="form-label">Problem description / సమస్య వివరాలు *</label><textarea name="description" class="form-control" rows="4" required></textarea></div>
<div class="col-md-6"><label class="form-label">Households affected / ప్రభావిత కుటుంబాలు</label><input name="households_affected" class="form-control" type="number" min="0"></div>
<div class="col-md-6"><label class="form-label">Photo / ఫోటో</label><input name="photo" class="form-control" type="file" accept=".jpg,.jpeg,.png"><small class="text-muted">Max 5 MB</small></div>
<div class="col-md-6"><label class="form-label">Contact method / సంప్రదింపు విధానం</label><select name="contact_method" class="form-select"><option>Phone / ఫోన్</option><option>SMS</option><option>Either / ఏదైనా</option></select></div>
<div class="col-12"><button type="button" class="btn btn-outline-primary" onclick="useLocation()"><i class="bi bi-geo-alt"></i> Use My Location / నా ప్రదేశాన్ని ఉపయోగించండి</button><span id="locationStatus" class="small-muted ms-2"></span></div>
<input type="hidden" name="latitude" id="latitude"><input type="hidden" name="longitude" id="longitude">
<div class="col-12"><div class="form-check"><input class="form-check-input" id="c" type="checkbox" required><label class="form-check-label" for="c">I agree to submit these details to the village authority. / ఈ వివరాలను గ్రామ అధికారులకు పంపడానికి నేను అంగీకరిస్తున్నాను.</label></div></div>
</div><button class="btn btn-green btn-lg mt-4" type="submit">Submit Complaint / ఫిర్యాదును సమర్పించండి</button>
</form></div></div>
{% endblock %}
